<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
{{__base}}
<div class="card" style="align-items: center; text-align: center; padding-top: 120px;">
  <div class="eyebrow" style="margin-bottom: 60px;">{{eyebrow}}</div>

  <div style="font-family: 'Archivo Black', sans-serif; font-size: 200px; line-height: 0.6; color: var(--dawn-1); opacity: 0.85;">&ldquo;</div>

  <h1 class="display" style="font-size: 88px; max-width: 900px; margin-top: 8px;">{{statement}}</h1>

  <div class="horizon-rule" style="margin: 56px auto;"></div>

  <p class="body-copy" style="font-size: 32px; max-width: 780px; margin: 0 auto;">{{body}}</p>

  <div class="footer" style="width: 100%;">
    <span class="handle">{{handle}}</span>
    <span class="url">{{url}}</span>
  </div>
</div>
</body>
</html>
