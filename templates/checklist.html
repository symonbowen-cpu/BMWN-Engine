<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
{{__base}}
<div class="card">
  <div class="eyebrow">{{eyebrow}}</div>
  <h1 class="display" style="font-size: 74px; max-width: 900px;">{{headline}}</h1>

  <div style="margin-top: 56px; display: flex; flex-direction: column; gap: 26px; max-width: 880px;">
    <div style="display: flex; align-items: flex-start; gap: 24px; background: var(--dusk); border: 1px solid rgba(255,179,71,0.18); border-radius: 16px; padding: 28px 32px;">
      <div style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--dawn-1), var(--dawn-2)); display: flex; align-items: center; justify-content: center; font-family: 'Archivo Black', sans-serif; font-size: 26px; color: #14100A;">&#10003;</div>
      <div style="font-size: 31px; font-weight: 600; line-height: 1.35; color: var(--sand); padding-top: 3px;">{{check1}}</div>
    </div>
    <div style="display: flex; align-items: flex-start; gap: 24px; background: var(--dusk); border: 1px solid rgba(255,179,71,0.18); border-radius: 16px; padding: 28px 32px;">
      <div style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--dawn-1), var(--dawn-2)); display: flex; align-items: center; justify-content: center; font-family: 'Archivo Black', sans-serif; font-size: 26px; color: #14100A;">&#10003;</div>
      <div style="font-size: 31px; font-weight: 600; line-height: 1.35; color: var(--sand); padding-top: 3px;">{{check2}}</div>
    </div>
    <div style="display: flex; align-items: flex-start; gap: 24px; background: var(--dusk); border: 1px solid rgba(255,179,71,0.18); border-radius: 16px; padding: 28px 32px;">
      <div style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--dawn-1), var(--dawn-2)); display: flex; align-items: center; justify-content: center; font-family: 'Archivo Black', sans-serif; font-size: 26px; color: #14100A;">&#10003;</div>
      <div style="font-size: 31px; font-weight: 600; line-height: 1.35; color: var(--sand); padding-top: 3px;">{{check3}}</div>
    </div>
  </div>

  <div class="footer">
    <span class="handle">{{handle}}</span>
    <span class="url">{{url}}</span>
  </div>
</div>
</body>
</html>
